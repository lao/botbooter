# golangci-lint v2 configuration.
# Run locally with: golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        # Require doc comments on exported identifiers (godoc coverage gate).
        - name: exported
    misspell:
      # "noteable" is GitLab's own API spelling (noteable_type in Note Hook
      # payloads), not a typo — keep misspell from "correcting" it to "notable".
      ignore-rules:
        - noteable
  exclusions:
    rules:
      # Hardening lints target production servers; test fixtures and the
      # go-list subprocess in the isolation guard don't need them.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
