# golangci-lint v2 configuration.
# Run locally with: golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus:
    - bodyclose
    - errorlint
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
